; drop — PHP limits for hosts running PHP-FPM/CGI (most shared hosts).
; Note: .user.ini changes can take up to 5 minutes to apply (user_ini.cache_ttl).
upload_max_filesize = 310M
post_max_size = 320M
max_execution_time = 600
max_input_time = 600
memory_limit = 256M

; SPEED FIX for big files: if the wait after 100% upload is long, PHP's temp
; dir is on a different (slow) filesystem and the file must be copied instead
; of instantly renamed. Point the temp dir next to data/ (same filesystem):
; 1) create the folder:  mkdir /home/USER/public_html/drop/data/tmp
; 2) uncomment and fix the absolute path below (needs host support for this
;    setting; otherwise set it in the hosting panel's PHP options)
; upload_tmp_dir = /home/USER/public_html/drop/data/tmp
